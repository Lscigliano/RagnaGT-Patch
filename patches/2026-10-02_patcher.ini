; ------------------------------------------------------------------
; RagnaGT Patcher - configuracao
; Deixe PatchUrl vazio para rodar em MODO DEMONSTRACAO (simula patches).
; ------------------------------------------------------------------
[Patcher]
; URL base onde ficam patchlist.txt, patcher_version.txt e a pasta /patches
; Ex.: https://patch.ragnagt.com.br/
PatchUrl=https://raw.githubusercontent.com/Lscigliano/RagnaGT-Patch/main/

; Onde baixar o patcher novo (auto-update)
UpdateUrl=https://github.com/Lscigliano/RagnaGT-Patch/releases/latest/download/RagnaGT.Patcher.exe

; Executavel do jogo e argumentos
GameExe=ragnaGT.exe
GameArgs=1rag1

; GRF onde os patches .gpf/.thor serao aplicados
TargetGrf=coresnovas.grf

; Arquivo que guarda o numero do ultimo patch aplicado
PatchInfo=patch.inf

; Login-server: o patcher testa os enderecos na ordem (rede local, Hamachi...) e usa o primeiro que responde,
; gravando-o em data\clientinfo.xml. Na VPS: Hosts=ip.da.vps
[Server]
Hosts=192.168.18.60,25.19.42.222
Port=6900
WebPort=8080

[Links]
; auto = pagina de cadastro do servidor (http://host:WebPort/)
Site=auto
Discord=https://discord.gg/
Settings=opensetup.exe
